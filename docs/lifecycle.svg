<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#08111f"/>
  <rect x="40" y="28" width="1520" height="844" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <text x="800" y="86" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Lifecycle</text>
  <text x="800" y="126" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Four statuses. Arrival is a clock time, not a step.</text>

  <text x="80" y="178" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">PRD SKETCH</text>

  <rect x="80" y="196" width="248" height="64" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="204" y="234" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">REQUESTED</text>
  <line x1="336" y1="228" x2="368" y2="228" stroke="#475569" stroke-width="3"/>
  <polygon points="368,222 382,228 368,234" fill="#475569"/>

  <rect x="390" y="196" width="248" height="64" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="514" y="234" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">MATCHED</text>
  <line x1="646" y1="228" x2="678" y2="228" stroke="#475569" stroke-width="3"/>
  <polygon points="678,222 692,228 678,234" fill="#475569"/>

  <rect x="700" y="196" width="268" height="64" rx="14" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
  <text x="834" y="234" text-anchor="middle" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">DRIVER_ARRIVED</text>
  <line x1="976" y1="228" x2="1008" y2="228" stroke="#475569" stroke-width="3"/>
  <polygon points="1008,222 1022,228 1008,234" fill="#475569"/>

  <rect x="1030" y="196" width="220" height="64" rx="14" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
  <text x="1140" y="234" text-anchor="middle" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">STARTED</text>
  <line x1="1258" y1="228" x2="1290" y2="228" stroke="#475569" stroke-width="3"/>
  <polygon points="1290,222 1304,228 1290,234" fill="#475569"/>

  <rect x="1312" y="196" width="220" height="64" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="1422" y="234" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">COMPLETED</text>

  <text x="834" y="284" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="15">folded into a timestamp</text>
  <text x="1140" y="284" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="15">became IN_PROGRESS</text>

  <text x="80" y="348" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">PASSENGER REQUEST</text>

  <rect x="80" y="368" width="280" height="84" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="220" y="416" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">REQUESTED</text>
  <line x1="368" y1="410" x2="404" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="404,404 418,410 404,416" fill="#94a3b8"/>

  <rect x="426" y="368" width="280" height="84" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="566" y="416" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">MATCHED</text>
  <line x1="714" y1="410" x2="750" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="750,404 764,410 750,416" fill="#94a3b8"/>

  <rect x="772" y="368" width="300" height="84" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="922" y="416" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">IN_PROGRESS</text>
  <line x1="1080" y1="410" x2="1116" y2="410" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="1116,404 1130,410 1116,416" fill="#94a3b8"/>

  <rect x="1138" y="368" width="280" height="84" rx="16" fill="#052e1b" stroke="#10b981" stroke-width="2.5"/>
  <text x="1278" y="416" text-anchor="middle" fill="#ecfdf5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">COMPLETED</text>

  <text x="800" y="488" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="18">CANCELLED from REQUESTED, or from MATCHED while the ride is still waiting. Not after lock. Not after start.</text>

  <text x="80" y="548" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">THE RIDE</text>

  <rect x="80" y="568" width="230" height="100" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="195" y="612" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">WAITING</text>
  <text x="195" y="640" text-anchor="middle" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="14">seats still open</text>
  <line x1="318" y1="618" x2="348" y2="618" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="348,612 362,618 348,624" fill="#94a3b8"/>

  <rect x="370" y="568" width="230" height="100" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="485" y="612" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">MATCHED</text>
  <text x="485" y="640" text-anchor="middle" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="14">locked</text>
  <line x1="608" y1="618" x2="638" y2="618" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="638,612 652,618 638,624" fill="#94a3b8"/>

  <rect x="660" y="568" width="250" height="100" rx="16" fill="#1c1408" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="785" y="608" text-anchor="middle" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">arrived_at</text>
  <text x="785" y="636" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="14">timestamp, not a status</text>
  <line x1="918" y1="618" x2="948" y2="618" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="948,612 962,618 948,624" fill="#94a3b8"/>

  <rect x="970" y="568" width="270" height="100" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="1105" y="624" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">IN_PROGRESS</text>
  <line x1="1248" y1="618" x2="1278" y2="618" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="1278,612 1292,618 1278,624" fill="#94a3b8"/>

  <rect x="1300" y="568" width="232" height="100" rx="16" fill="#052e1b" stroke="#10b981" stroke-width="2.5"/>
  <text x="1416" y="624" text-anchor="middle" fill="#ecfdf5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">COMPLETED</text>

  <text x="800" y="708" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="18">CANCELLED only if the last passenger leaves while the ride is still WAITING.</text>

  <rect x="80" y="748" width="1440" height="96" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="800" y="786" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="18">Solo is MATCHED the moment the driver accepts. Shared stays WAITING until every seat is taken.</text>
  <text x="800" y="818" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="18">Start is blocked until arrived_at is written. Start moves the ride and every request to IN_PROGRESS together.</text>
</svg>
